[package]
name = "nano-cortex-firmware"
version = "0.2.0"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "nano-cortex-firmware"
path = "src/main.rs"
harness = false

[dependencies]
# The 1.2.2 tag keeps esp-hal, esp-radio, and esp-rtos on one bt-hci.
# crates.io esp-rtos 0.4.0 still requires the 1.2.0 release candidate.
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.2", features = ["esp32s3"] }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.2", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.2", features = ["esp32s3"] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.2", features = ["esp32s3", "unstable"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.2", features = ["esp32s3", "log-04"] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.2", features = ["esp32s3"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.2", features = ["esp32s3", "ble", "unstable", "log-04"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.2", features = ["esp32s3", "embassy", "esp-radio", "log-04"] }
bt-hci = "0.9"
embedded-io = "0.7"
embassy-executor = { version = "0.10", default-features = false }
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "14cf6a68ec0bfd0ecf873f7e3dbb2eb69013fa29", features = ["log"] }
gt911 = "0.3"
libm = "0.2"
log = "0.4"
nano-wire = { path = "../crates/nano-wire" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
slint = { version = "1.13.1", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }
trouble-host = { version = "0.7", default-features = false, features = [
    "central",
    "gatt",
    "scan",
    "log",
    "default-packet-pool-mtu-512",
    "default-packet-pool-size-16",
    # 16 slots × 512 bytes per GattClient; clients are heap-backed to keep this
    # queue from consuming the main task's stack.
    "gatt-client-notification-queue-size-16",
    "gatt-client-notification-max-subscribers-4",
] }

[features]
# Count scan-out glitches in the display interrupts and log them.
scan-diag = []
# Run the complete touch UI without initializing the Bluetooth controller.
ui-only = []
# Compare Bluetooth startup with the original bt-hci command-slot controller.
original-hci = []

# MSC needs the Git USB stack/driver and its private sync dependency. Keep the
# shared time/futures runtime on crates.io instead of replacing it for USB.
[patch."https://github.com/embassy-rs/embassy"]
embassy-futures = { version = "=0.1.2" }
embassy-time = { version = "=0.5.1" }

[patch.crates-io]
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "14cf6a68ec0bfd0ecf873f7e3dbb2eb69013fa29" }

[build-dependencies]
slint-build = "=1.13.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
