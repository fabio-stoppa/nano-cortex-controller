[package]
name = "nano-midi-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bt-hci = "0.9"
embedded-io = "0.7"
critical-section = { version = "1", features = ["std"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["mock-driver", "generic-queue-8"] }
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
libm = "0.2"
log = "0.4"
nano-wire = { path = "../../../crates/nano-wire" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
